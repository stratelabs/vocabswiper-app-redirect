<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Vocab Swiper</title>
  <meta name="apple-itunes-app" content="app-id=6782795150" />
  <link rel="icon" type="image/png" href="/favicon.png?v=3" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="/favicon-dark.png?v=3" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/icon.png?v=3">
  <style>
    html,body{height:100%;margin:0;background:#1E1F25;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      display:flex;align-items:center;justify-content:center;text-align:center}
    .wrap{padding:24px;max-width:340px}
    h1{font-size:22px;font-weight:800;margin:0 0 8px}
    p{opacity:.6;margin:6px 0 18px;line-height:1.4}
    a{color:#8B63FF;font-weight:700;text-decoration:none;font-size:17px}
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <p>Opening Vocab Swiper…</p>
    <p><a id="store" href="https://apps.apple.com/app/id6782795150">Download Vocab Swiper</a></p>
  </div>
  <script>
    (function () {
      // Android to Google Play, everything else (iPhone, iPad, desktop) to
      // the App Store. The .app names are for people who want the app, so
      // they go to a store listing rather than to vocabswiper.com.
      var IOS = 'https://apps.apple.com/app/id6782795150';
      var ANDROID = 'https://play.google.com/store/apps/details?id=com.stratelabs.vocab';
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var url = /android/i.test(ua) ? ANDROID : IOS;
      document.getElementById('store').href = url;
      location.replace(url);
    })();
  </script>
</body>
</html>
